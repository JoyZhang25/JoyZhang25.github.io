        new_tab: true

projects:
  - id: "elo-ratings"
    title: "Elo Ratings as Constant-Step SGD"
    github: "https://github.com/JoyZhang25/elo-online-learning"
    problem: "How does the Elo update factor trade off stationary rating noise against adaptation when latent skill changes?"
    method: "Controlled Bradley-Terry simulations and a chronological ATP forecasting study interpret Elo as constant-step stochastic gradient descent."
    result: "On 39,247 completed ATP matches from 2010-2025, validation selected a surface-aware Elo model. Its 2022-2025 test log loss was 0.6195 versus 0.6225 for standard Elo; the project reports no statistically resolved improvement over betting-market probabilities."
    tags:
      - "Stochastic approximation"
      - "Bradley-Terry models"
      - "Walk-forward validation"
      - "Python"
    figure:
      path: "/images/projects/elo-atp-walk-forward.png"
      alt: "Three-panel chronological ATP study showing the Surface Elo validation grid, held-out model log losses, and test-period calibration."
      caption: "Chronological ATP study: validation-selected Surface Elo, locked 2022–2025 test results, and calibration."
      width: 2572
      height: 778

