about:
  - 'I am a PhD candidate in Mathematics at the Georgia Institute of Technology, where I am fortunate to be co-advised by <a href="https://cmao35.math.gatech.edu/" target="_blank" rel="noopener noreferrer">Cheng Mao</a> and <a href="https://www.debankur-mukherjee.com/" target="_blank" rel="noopener noreferrer">Debankur Mukherjee</a>. My research lies in applied probability, stochastic processes, optimization, and statistical learning, with a current focus on the long-run behavior of stochastic-gradient algorithms and the mean-field analysis of stochastic networks.'
  - 'Before Georgia Tech, I completed a BSc and an MSc in Mathematics at the University of Melbourne, and I am grateful to have had Professor <a href="https://findanexpert.unimelb.edu.au/profile/971-konstantin-borovkov" target="_blank" rel="noopener noreferrer">Konstantin Borovkov</a> as my master&apos;s advisor.'

