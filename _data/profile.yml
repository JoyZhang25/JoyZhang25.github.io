  - title: "Integro-local CLT for Preferential-Attachment Dynamics on Random Networks"
    authors:
      - name: "Jingyi Zhang"
    advisor:
      prefix: "Professor"
      name: "Konstantin Borovkov"
      url: "https://findanexpert.unimelb.edu.au/profile/971-konstantin-borovkov"
    status: "Master's research project"
    venue: "University of Melbourne"
    date: "October 2021"
    summary: "Derived uniform Gaussian local and integro-local asymptotics for the location of a point selected with probability proportional to its weight in a dynamic version of the Neyman contagious point process. The results cover one-dimensional and multivariate lattice, non-lattice, and mixed settings, extending classical local limit theorems from i.i.d. sums to independent, non-identically distributed summands generated by the model."
    links:
