# AcademicPages / Jekyll configuration for the multi-page personal site.
locale: "en-US"
title: "Jingyi (Joy) Zhang"
title_separator: "-"
description: "Academic homepage of Jingyi (Joy) Zhang, a Mathematics PhD candidate at Georgia Tech working in applied probability, stochastic processes, and optimization."
url: "https://JoyZhang25.github.io"
baseurl: ""
repository: "JoyZhang25/JoyZhang25.github.io"
timezone: "America/New_York"
google_site_verification: "kh2z2RWqSQ6CEnImLNm1OKpe9cFGUsAjpT8lKm-_fQI"

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  smart_quotes: lsquo,rsquo,ldquo,rdquo

plugins:
  - jekyll-sitemap

# The repository began as the AcademicPages template. The directories below
# contain its sample pages, posts, talks, publications, and generators. They are
# retained in source for framework compatibility but are not published.
exclude:
  - .bundle
  - .devcontainer
  - .github
  - .sass-cache
  - _data/authors.yml
  - _data/comments
  - _data/cv.json
  - _data/navigation.yml
  - _data/ui-text.yml
  - _drafts
  - _pages
  - _portfolio
  - _posts
  - _publications
  - _talks
  - _teaching
  - assets/js
  - Dockerfile
  - docker-compose.yaml
  - files/bibtex1.bib
  - files/paper1.pdf
  - files/paper2.pdf
  - files/paper3.pdf
  - files/slides1.pdf
  - files/slides2.pdf
  - files/slides3.pdf
  - Gemfile
  - Gemfile.lock
  - images/500x300.png
  - images/bio-photo-2.jpg
  - images/bio-photo.jpg
  - images/editing-talk.png
  - images/profile.png
  - images/themes
  - images/wiki
  - LICENSE
  - local
  - markdown_generator
  - node_modules
  - package.json
  - package-lock.json
  - README.md
  - scripts
  - talkmap
  - talkmap.ipynb
  - talkmap.py
  - talkmap_out.ipynb
  - tmp
  - vendor

keep_files:
  - .git

encoding: "utf-8"
strict_front_matter: true
